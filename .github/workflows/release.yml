# Pushing a tag v<version> publishes a release with BigSpender-v<version>.zip, which unzips to a BigSpender folder for addons.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          mkdir -p package/BigSpender
          cp BigSpender.lua README.md LICENSE package/BigSpender/
          cd package && zip -r ../BigSpender-${{ github.ref_name }}.zip BigSpender

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} BigSpender-${{ github.ref_name }}.zip --generate-notes
